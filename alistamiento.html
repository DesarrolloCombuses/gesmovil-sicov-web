<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alistamiento diario — SICOV</title>
<meta name="description" content="Verificación previa a la operación del vehículo.">
<meta name="theme-color" content="#1a4fa0">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icono-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./assets/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SICOV">
<link rel="stylesheet" href="./assets/app.css">
</head>
<body>

<div class="cinta" id="cinta-version" hidden></div>
<div class="cinta" id="cinta-conexion" hidden></div>

<div class="envoltura">
  <!-- La cabecera lleva el progreso dentro. Antes el titulo iba arriba y el
       contador abajo en la barra: el conductor tenia que mirar a dos sitios
       para saber como va, y el titulo ocupaba una franja que no decia nada
       despues del primer segundo. -->
  <header class="hero">
    <div class="hero-fila">
      <div class="hero-texto">
        <p class="hero-rotulo">Alistamiento diario</p>
        <h1>Revisión del vehículo</h1>
      </div>
      <div class="hero-cifra" aria-hidden="true">
        <strong id="hero-hechas">0</strong><span id="hero-total">/0</span>
      </div>
    </div>
    <div class="progreso-riel" role="progressbar" aria-label="Puntos verificados">
      <div class="progreso-lleno" id="progreso-lleno"></div>
    </div>
    <p class="hero-pie" id="progreso-texto" aria-live="polite">Sin empezar</p>
  </header>

  <div id="cargando" class="cargando">Cargando…</div>
  <div id="aviso" class="aviso error" hidden></div>

  <form id="formulario" hidden>
    <div class="panel">
      <h2>Vehículo y conductor</h2>

      <label data-campo="placa">
        <span class="etiqueta">Placa</span>
        <select id="placa" required aria-describedby="err-placa">
          <option value="">Selecciona el vehículo…</option>
        </select>
        <span class="error-campo" id="err-placa" role="alert" hidden></span>
      </label>

      <label data-campo="cedula">
        <span class="etiqueta">Cédula del conductor</span>
        <!-- inputmode numeric y pattern: en iOS abre el teclado de numeros sin
             convertir el campo en type=number, que admite signos y notacion
             cientifica y deja el valor vacio si el texto no es un numero. -->
        <input id="cedula" type="text" inputmode="numeric" pattern="[0-9]*"
               autocomplete="off" autocapitalize="off" autocorrect="off"
               spellcheck="false" enterkeyhint="next" maxlength="10"
               required aria-describedby="err-cedula pista-conductor"
               placeholder="Sin puntos ni espacios">
        <span class="pista" id="pista-conductor"></span>
        <span class="error-campo" id="err-cedula" role="alert" hidden></span>
      </label>

      <!-- readonly: el nombre lo pone la nomina, no el conductor. Sirve para
           que confirme que es el, no para aportar el dato. -->
      <label data-campo="nombre">
        <span class="etiqueta">Nombre del conductor</span>
        <input id="nombre" type="text" autocomplete="off" required readonly
               tabindex="-1" placeholder="Se completa con la cédula">
      </label>

      <label data-campo="kilometraje">
        <span class="etiqueta">Kilometraje <span class="pista enlinea">(opcional)</span></span>
        <input id="kilometraje" type="text" inputmode="numeric" pattern="[0-9]*"
               autocomplete="off" autocapitalize="off" autocorrect="off"
               spellcheck="false" enterkeyhint="done" maxlength="9"
               aria-describedby="err-kilometraje">
        <span class="error-campo" id="err-kilometraje" role="alert" hidden></span>
      </label>
    </div>

    <div class="panel">
      <h2>Verificación</h2>
      <p class="sub nota">
        Toca <strong>✓</strong> si el punto está bien o <strong>!</strong> si encontraste una
        novedad. Al terminar un bloque se abre el siguiente.
      </p>
      <div id="checklist"></div>
    </div>

    <div class="panel">
      <h2>Observaciones</h2>
      <label>
        <textarea id="observaciones" maxlength="500" enterkeyhint="done"
                  placeholder="Algo más que deba quedar registrado (opcional)"></textarea>
        <span class="contador" id="cuenta-obs" aria-live="polite"></span>
      </label>
    </div>
  </form>

  <!-- Lo que falta, en una lista donde cada punto lleva a su sitio. Un aviso
       suelto arriba obliga a buscar a mano cual de los cuarenta y tantos
       campos es el que reclama. -->
  <div class="pendientes" id="pendientes" hidden>
    <p class="pendientes-titulo">
      <span class="pendientes-icono" aria-hidden="true">!</span>
      <span id="pendientes-titulo-texto">Falta completar</span>
    </p>
    <ul class="pendientes-lista" id="pendientes-lista"></ul>
  </div>

  <p class="pie">SICOV · <span id="version">…</span></p>
</div>

<!-- Solo el boton: el progreso ya vive en la cabecera. El rotulo del boton
     dice que falta, para que no haya que subir a mirar por que esta apagado. -->
<div class="barra" id="barra" hidden>
  <div class="barra-interna">
    <button type="button" class="primario ancho" id="enviar" disabled>
      <span id="enviar-texto">Registrar alistamiento</span>
    </button>
  </div>
</div>

<!-- comun.js primero: registra el service worker y define window.SICOV, del
     que depende el resto. Los dos son clasicos (no modulos) para que se
     ejecuten en orden sin defer. -->
<script src="./assets/comun.js"></script>
<script src="./assets/alistamiento.js"></script>
</body>
</html>
